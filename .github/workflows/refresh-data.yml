name: refresh-market-data

# Runs the data pipeline every weekday morning ET and commits the fresh JSON
# back to the repo so GitHub Pages serves up-to-date sector/RS data.
#
# You can also trigger it manually from the Actions tab -> "Run workflow".

on:
  schedule:
    # 11:00 UTC = 06:00 America/New_York during EST (07:00 during EDT).
    # Runs Mon-Fri; markets closed weekends so no point burning minutes.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

# Grant the built-in GITHUB_TOKEN write access so we can commit data/ back.
permissions:
  contents: write

# One run at a time, cancel any queued dupes.
concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: uv sync

      - name: Run pipeline (fetch EOD data + compute RS ranks + write JSON)
        working-directory: pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run python -u build_rs_data.py

      - name: Commit updated data/ if anything changed
        run: |
          git config user.name  "market-command-center-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit."
          else
            AS_OF=$(python -c "import json; print(json.load(open('data/meta.json'))['as_of_date'])")
            git commit -m "data: refresh EOD snapshot as of ${AS_OF}"
            git push
          fi
